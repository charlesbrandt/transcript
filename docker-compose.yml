services:
  api:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
    env_file:
      - .env
    ports:
      - "8400:8000"
    volumes:
      - .:/app:cached
    working_dir: /app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui:
    build: ./ui
    ports:
      - "3006:5173"
    volumes:
      - ./ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Keep the old app service for CLI use
  app:
    build:
      context: .
      args:
        UID: ${UID}
        GID: ${GID}
    env_file:
      - .env
    volumes:
      - .:/app:cached
    working_dir: /app
    command: tail -f /dev/null
    tty: true
    stdin_open: true
    stop_signal: SIGKILL
    user: "${UID}:${GID}"
    environment:
      - PYTHONPATH=/app
    profiles:
      - cli

volumes:
  cache-whisper:
